<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuttige Links</title>
    <script>
        document.documentElement.dataset.scheme =
            localStorage.getItem('prefers-color-scheme') ??
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
    <link rel="shortcut icon" href="static/icon.png">
    <link rel="stylesheet" href="static/css/theme.css">
    <link rel="stylesheet" href="static/css/layout.css">
    <link rel="stylesheet" href="static/css/styling.css">
    <link rel="stylesheet" href="static/css/function.css">
    <link rel="stylesheet" href="static/css/dirty-states.css">
    <script type="module" src="static/js/main-fetch.js"></script>
</head>

<body>
    <header>
        <h1>CSa <span>|</span> Nuttige Links</h1>
        <link-toolbar></link-toolbar>
        <button data-action="toggle-edit" data-nav-header>✎ Edit</button>
        <button data-action="help" data-nav-header aria-label="Help">?</button>
        <button data-action="login" data-nav-header hidden>Login</button>
        <button data-action="logout" data-nav-header hidden>Logout</button>
        <darkmode-toggle data-nav-header></darkmode-toggle>
    </header>
    <main id="app">
        <link-tree></link-tree>
        <link-dialog></link-dialog>
        <bulk-link-dialog></bulk-link-dialog>
        <container-dialog></container-dialog>
        <reorder-sections-dialog></reorder-sections-dialog>
        <help-dialog></help-dialog>
    </main>
</body>

</html>
