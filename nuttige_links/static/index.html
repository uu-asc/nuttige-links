<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuttige Links</title>
    <script>
        document.documentElement.dataset.scheme =
            localStorage.getItem('prefers-color-scheme') ??
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/styling.css">
    <link rel="stylesheet" href="/static/css/function.css">
    <link rel="stylesheet" href="/static/css/dirty-states.css">
    <script type="module" src="static/js/main.js"></script>
</head>

<body>
    <header>
        <h1>Nuttige Links</h1>
        <link-toolbar></link-toolbar>
        <button data-action="toggle-edit">✎ Edit</button>
        <darkmode-toggle></darkmode-toggle>
    </header>
    <main id="app">
        <link-tree></link-tree>
        <link-dialog></link-dialog>
        <container-dialog></container-dialog>
        <reorder-sections-dialog></reorder-sections-dialog>
    </main>
</body>

</html>
